name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data from GitHub
        run: node scripts/fetch-github-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build website
        run: node scripts/build.mjs
        env:
          IMPRESSUM_ADDRESS: ${{ secrets.IMPRESSUM_ADDRESS }}
      - name: Find changed pages
        id: changed
        run: |
          if node scripts/indexnow.mjs geaendert > "$RUNNER_TEMP/changed-urls.txt"; then
            {
              echo "urls<<EOF"
              cat "$RUNNER_TEMP/changed-urls.txt"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Live-Vergleich fehlgeschlagen. Veröffentlichung ohne Suchdienstmeldung."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: [build, deploy]
    if: needs.build.outputs.changed != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow (Bing, Yandex, Seznam, Naver, Yep)
        run: node scripts/indexnow.mjs senden
        env:
          URLS: ${{ needs.build.outputs.changed }}
      - name: Google Search Console (Sitemap erneut einreichen)
        run: node scripts/google-sitemap.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
